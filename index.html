<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘의 응원 한마디</title>
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #ff7a59;
      --accent-dark: #e8613f;
      --error-bg: #fdecec;
      --error-text: #b3261e;
      --border: #f0dcc8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 20px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }

    main {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 1.05rem;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hint {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 400;
    }

    input {
      width: 100%;
      font-size: 1.25rem;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      width: 100%;
      font-size: 1.35rem;
      font-weight: 700;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    button:hover { background: var(--accent-dark); }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      margin-top: 24px;
      min-height: 140px;
      padding: 24px 20px;
      border-radius: 20px;
      background: var(--card);
      border: 2px dashed var(--border);
      text-align: center;
      font-size: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #result .to {
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 8px;
    }

    #result.placeholder,
    #result.loading { color: var(--muted); font-size: 1.15rem; }

    #result.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 2px solid var(--error-text);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>오늘의 응원 한마디</h1>
    <p class="subtitle">닉네임을 적고 응원을 받아 보세요</p>

    <form class="card" id="form">
      <label for="name">
        공개용 닉네임
        <span class="hint">실명 대신 화면에 보여도 괜찮은 이름을 적어 주세요. 비우면 "여러분"으로 불러요.</span>
      </label>
      <input id="name" type="text" maxlength="20" placeholder="예: 반짝이" autocomplete="off" />
      <button id="btn" type="submit">응원 받기</button>
    </form>

    <section id="result" class="placeholder" aria-live="polite">
      버튼을 누르면 여기에 응원이 나타나요.
    </section>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("name");
    const btn = document.getElementById("btn");
    const result = document.getElementById("result");

    function show(state, text) {
      result.className = state;
      result.textContent = text;
    }

    function showMessage(name, message) {
      result.className = "";
      result.textContent = "";
      const to = document.createElement("div");
      to.className = "to";
      to.textContent = name === "여러분" ? "여러분께" : name + "님께";
      const body = document.createElement("div");
      body.textContent = message;
      result.append(to, body);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = input.value.trim();

      btn.disabled = true;
      btn.textContent = "응원 찾는 중...";
      show("loading", "응원 문장을 가져오는 중이에요...");

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);

      try {
        const res = await fetch("api/message?name=" + encodeURIComponent(name), {
          signal: controller.signal,
          cache: "no-store",
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const type = res.headers.get("Content-Type") || "";
        if (!type.includes("application/json")) throw new Error("JSON 응답이 아님");

        const data = await res.json();
        if (typeof data.message !== "string" || typeof data.name !== "string") {
          throw new Error("응답 형식 오류");
        }
        showMessage(data.name, data.message);
      } catch (err) {
        const reason = err.name === "AbortError" ? "응답 시간이 너무 오래 걸렸어요." : "서버에서 응원을 받아오지 못했어요.";
        show("error", reason + " 잠시 후 다시 시도해 주세요. (" + err.message + ")");
      } finally {
        clearTimeout(timer);
        btn.disabled = false;
        btn.textContent = "응원 받기";
      }
    });
  </script>
</body>
</html>
